provider: deepseek
name: "DeepSeek"
base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
models:
  - name: deepseek-chat
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.002
  - name: deepseek-reasoner
    input_cost_per_1k: 0.001
    output_cost_per_1k: 0.004
health_check:
  endpoint: /models
  timeout: 5s
  interval: 30s
